<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jitter Click Test</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6783067256794096"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="layout">

    <aside class="left-ad"></aside>

    <div class="container">

        <h1>🔥 Jitter Click Test</h1>

        <p class="subtitle">
            Measure your jitter clicking speed
        </p>

        <div class="stats">

            <div class="card">
                <h2 id="cps">0.0</h2>
                <span>CPS</span>
            </div>

            <div class="card">
                <h2 id="clicks">0</h2>
                <span>Clicks</span>
            </div>

            <div class="card">
                <h2 id="time">10</h2>
                <span>Seconds</span>
            </div>

        </div>

        <button id="jitterButton">
            🔥 CLICK FAST
        </button>

        <div class="modes">

            <button class="mode" data-time="5">5s</button>
            <button class="mode active" data-time="10">10s</button>
            <button class="mode" data-time="15">15s</button>
            <button class="mode" data-time="30">30s</button>
            <button class="mode" data-time="60">60s</button>

        </div>

        <div class="custom-time">

            <input
                type="number"
                id="customTime"
                placeholder="Seconds"
                min="1"
                max="300">

            <button id="applyTime">
                Apply
            </button>

            <button id="restartButton">
                Restart
            </button>

        </div>

        <div class="result">

            <h3>Best Score</h3>

            <p id="bestScore">0 CPS</p>

        </div>

        <div class="tools">

            <h2>🧪 More Tools</h2>

            <p class="tools-subtitle">
                Try our other free testing tools.
            </p>

            <div class="tools-grid">

                <a href="index.html" class="tool-card">🖱️ Click Test</a>

                <a href="doubleclick.html" class="tool-card">🖱️ Double Click</a>

                <a href="spacebartest.html" class="tool-card">⌨️ Spacebar</a>

                <a href="reactime.html" class="tool-card">⚡ Reaction</a>

                <a href="keyboard.html" class="tool-card">⌨️ Keyboard</a>

                <a href="dragclick.html" class="tool-card">🖱️ Drag Click</a>

            </div>

        </div>

        <footer>

            <p>© 2026 ClickTester</p>

            <a href="about.html">About</a> |
            <a href="privacy.html">Privacy</a> |
            <a href="contact.html">Contact</a>

        </footer>

    </div>

    <aside class="right-ad"></aside>

</div>

<script src="jitterclick.js"></script>

</body>
</html>
